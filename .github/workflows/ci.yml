# Continuous integration: proves every push still builds and passes before it
# reaches production. Render deploys from the same branch, so a red build here
# is the warning that a deploy will be broken.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify build output exists
        run: test -f frontend/dist/index.html

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the exact image the host will build, so a Dockerfile mistake is
      # caught here rather than during a live deploy.
      - name: Build image
        run: docker build -t audit-engine:ci .
      - name: Boot it and check /api/health
        run: |
          docker run -d --name ci -p 8021:8021 -e PORT=8021 audit-engine:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8021/api/health; then echo "healthy"; exit 0; fi
            sleep 3
          done
          echo "did not become healthy:"; docker logs ci; exit 1
      - name: Stop
        if: always()
        run: docker rm -f ci || true
